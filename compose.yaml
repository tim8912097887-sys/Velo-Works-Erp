services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    volumes:
      - engineer-mssql-data:/var/opt/mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the root .env file}
    ports:
      - "1433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID(N'engineer') IS NULL CREATE DATABASE [engineer]"
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the root .env file}
    depends_on:
      mssql:
        condition: service_healthy

  engineer-migrate:
    build:
      context: .
      dockerfile: ./services/engineer-service/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: "sqlserver://mssql:1433;database=engineer;user=sa;password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the root .env file};encrypt=true;trustServerCertificate=true"
    depends_on:
      mssql-init:
        condition: service_completed_successfully

  engineer-service:
    build:
      context: .
      dockerfile: ./services/engineer-service/Dockerfile
    container_name: engineer-service
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "sqlserver://mssql:1433;database=engineer;user=sa;password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the root .env file};encrypt=true;trustServerCertificate=true"
    depends_on:
      engineer-migrate:
        condition: service_completed_successfully

volumes:
  engineer-mssql-data:
