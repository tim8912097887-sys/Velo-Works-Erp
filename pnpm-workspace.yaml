packages:
  - 'packages/*'
  - 'services/*'

catalog:
  # NestJS Core & Platform
  '@nestjs/common': '12.3.3'
  '@nestjs/core': '12.3.3'
  '@nestjs/platform-express': '12.3.3'
  '@nestjs/testing': '12.3.3'
  '@nestjs/cli': '12.0.11'
  '@nestjs/schematics': '12.0.12'

  # Core Runtimes & Metadata
  rxjs: '7.8.2'
  reflect-metadata: '0.2.2'
  express: '5.2.1'

  # TypeScript & Compiler Tooling
  typescript: '7.0.2'
  ts-node: '10.9.2'
  ts-loader: '9.6.2'
  tsconfig-paths: '4.2.0'
  source-map-support: '0.5.21'

  # Testing Suite (Vitest & Supertest & Postman)
  vitest: '5.1.0'
  supertest: '7.3.1'
  '@types/supertest': '7.2.1'
  '@types/node': '26.6.6'
  '@types/express': '5.0.6'
  newman: '6.2.3'

  # Linting & Formatting
  eslint: '10.14.0'
  '@eslint/js': '10.0.1'
  '@eslint/eslintrc': '3.3.7'
  typescript-eslint: '8.72.1'
  eslint-config-prettier: '10.1.8'
  eslint-plugin-prettier: '5.5.7'
  prettier: '3.9.10'
  globals: '17.14.0'

  # Logger
  nestjs-pino: '5.3.1'
  pino: '10.4.0'

  # Prisma
  prisma: '7.10.1'
  '@prisma/client': '7.10.1'
  '@prisma/adapter-mssql': '7.10.1'
  '@prisma/client-runtime-utils': '7.10.1'

  '@types/mssql': '12.3.0'
  zod: '4.6.7'
  '@nestjs/config': '12.1.0'
  dotenv: '18.0.9'
  husky: '9.1.7'

overrides:
  pino: 'catalog:'
  'nestjs-pino>pino': 'catalog:'
