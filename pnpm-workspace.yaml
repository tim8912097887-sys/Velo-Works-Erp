packages:
  - 'packages/*'
  - 'services/*'

catalog:
  # NestJS Core & Platform
  '@nestjs/common': '11.0.1'
  '@nestjs/core': '11.0.1'
  '@nestjs/platform-express': '11.0.1'
  '@nestjs/testing': '11.0.1'
  '@nestjs/cli': '11.0.0'
  '@nestjs/schematics': '11.0.0'

  # Core Runtimes & Metadata
  rxjs: '7.8.1'
  reflect-metadata: '0.2.2'
  express: '5.2.1'

  # TypeScript & Compiler Tooling
  typescript: '5.7.3'
  ts-node: '10.9.2'
  ts-loader: '9.5.2'
  tsconfig-paths: '4.2.0'
  source-map-support: '0.5.21'

  # Testing Suite (Vitest & Supertest & Postman)
  vitest: '4.1.12'
  supertest: '7.2.2'
  '@types/supertest': '6.0.3'
  '@types/node': '22.10.7'
  '@types/express': '5.0.0'
  newman: '6.2.3'

  # Linting & Formatting
  eslint: '9.22.0'
  '@eslint/js': '9.22.0'
  '@eslint/eslintrc': '3.3.0'
  typescript-eslint: '8.20.0'
  eslint-config-prettier: '10.0.1'
  eslint-plugin-prettier: '5.2.2'
  prettier: '3.4.2'
  globals: '16.0.0'

  # Logger
  nestjs-pino: '4.6.0'
  pino: '10.3.1'

  # Prisma
  prisma: '7.0.1'
  '@prisma/client': '7.0.1'
  '@prisma/adapter-mssql': '7.0.1'
  '@prisma/client-runtime-utils': '7.0.1'

  '@types/mssql': '12.3.0'
  zod: '4.0.0'
  '@nestjs/config': '12.0.0'
  dotenv: '17.4.2'
  husky: '9.1.7'

overrides:
  pino: 'catalog:'
  'nestjs-pino>pino': 'catalog:'
